name: Basecraft errors CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "packages/basecraft-errors/**"
      - "!packages/basecraft-errors/**/*.md"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # - run: npm run check:code --workspace=@basecraft/errors TODO: typescript-eslint + typescript

      - name: Check types
        run: npm run check:types --workspace=@basecraft/errors
