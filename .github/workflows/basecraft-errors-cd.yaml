name: Basecraft errors CD

on:
  push:
    branches: ["main"]
    paths:
      - "packages/basecraft-errors/**"

jobs:
  deployment:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - run: npm ci
      # - run: npm run check:code --workspace=@basecraft/errors TODO: typescript-eslint + typescript

      - name: Build package
        run: npm run build --workspace=@basecraft/errors

      - name: Publish package
        run: npm publish --workspace=@basecraft/errors --access public
        env:
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} TODO: ver cómo falla