name: Basecraft core CD

on:
  push:
    branches: ["main"]
    paths:
      - "packages/basecraft-core/**"
      - "!packages/basecraft-core/**/*.md"

jobs:
  deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci
      # - run: npm run check:code --workspace=@basecraft/errors TODO: typescript-eslint + typescript

      - name: Build dependencies
        run: npm run build --workspace=packages/basecraft-errors && npm run build --workspace=packages/basecraft-types

      - name: Build package
        run: npm run build --workspace=@basecraft/core

      - name: Run tests
        run: npm run test --workspace=@basecraft/core

      - name: Publish package
        run: npm publish --workspace=@basecraft/core --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
