name: Basecraft types CD

on:
  push:
    branches: ["main"]
    paths:
      - "packages/basecraft-types/**"
      - "!packages/basecraft-types/**/*.md"

jobs:
  deployment:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      # - run: npm run check:code --workspace=@basecraft/types TODO: typescript-eslint + typescript

      - name: Build dependencies
        run: npm run build --workspace=packages/basecraft-errors

      - name: Build package
        run: npm run build --workspace=@basecraft/types

      - name: Publish package
        run: npm publish --workspace=@basecraft/types --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
