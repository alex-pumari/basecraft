name: Basecraft types CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "packages/basecraft-types/**"
      - "!packages/basecraft-types/**/*.md"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - run: npm ci
      # - run: npm run check:code --workspace=@basecraft/types TODO: typescript-eslint + typescript
      - run: npm run check:types --workspace=@basecraft/types
